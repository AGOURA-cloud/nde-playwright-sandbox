<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PW05C — Isolated Development Loop</title>
  <style>body{max-width:560px;margin:3rem auto;padding:0 1rem;font:16px system-ui,sans-serif}button,input{font:inherit;padding:8px}#status{margin-top:1rem}li{margin:.5rem 0}</style>
</head>
<body>
  <main>
    <h1>PW05C Synthetic App</h1>
    <p>Local-only fixture; no external assets, requests, storage or credentials.</p>
    <label for="todo">New item</label>
    <input id="todo" placeholder="test-item" autocomplete="off">
    <button type="button" id="add">Add item</button>
    <button type="button" id="reset">Reset</button>
    <p role="status" id="status">Items: 0</p>
    <ul id="items"></ul>
  </main>
  <script>
  (() => {
    const input = document.querySelector("#todo");
    const list = document.querySelector("#items");
    const status = document.querySelector("#status");
    let count = 0;
    document.querySelector("#add").addEventListener("click", () => {
      const value = input.value.trim();
      if (!value) { status.textContent = "Enter an item"; return; }
      const li = document.createElement("li");
      li.textContent = value;
      list.appendChild(li);
      // Deliberate local-only regression for debugging/retest, not production logic.
      count += 2;
      status.textContent = "Items: " + count;
      input.value = "";
    });
    document.querySelector("#reset").addEventListener("click", () => {
      list.replaceChildren();
      count = 0;
      status.textContent = "Items: 0";
    });
  })();
  </script>
</body>
</html>
